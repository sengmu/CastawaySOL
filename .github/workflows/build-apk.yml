name: 构建 CastawaySOL Android 原生 APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch: # 支持在 GitHub 网页上手动一键触发

jobs:
  build-apk:
    name: 编译 Android APK 安装包
    runs-on: ubuntu-latest

    steps:
      - name: 检出源码
        uses: actions/checkout@v4

      - name: 设置 Node.js 20 环境
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'package-lock.json'

      - name: 安装项目依赖
        run: npm ci

      - name: 编译 Vite 前端高能资产
        run: npm run build

      - name: 同步资产至 Android 原生工程
        run: npx cap sync android

      - name: 设置 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: 赋予 Gradle 包装器执行权限
        run: chmod +x android/gradlew

      - name: 编译产出 Android APK (Debug 签名包)
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: 归档并导出 APK 安装包产物
        uses: actions/upload-artifact@v4
        with:
          name: CastawaySOL-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
